name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.6"
            image: python:3.6.15-slim-bullseye
          - python-version: "3.7"
            image: python:3.7.17-slim-bullseye
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Test the wheel and generate coverage
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          test_command='
            python --version
            python -m pip wheel --no-deps --wheel-dir wheelhouse .
            set -- wheelhouse/*.whl
            python -m pip install "$1[testing]"
            python -m coverage run --source=pyramid_forksafe -m pytest
            python -m coverage html
          '
          if [ -n "$PYTHON_IMAGE" ]; then
            docker run --rm --volume "$PWD:/project" --workdir /project \
              "$PYTHON_IMAGE" sh -ec "$test_command"
          else
            sh -ec "$test_command"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-py${{ matrix.python-version }}
          path: htmlcov/

  live-servers:
    name: Live server lifecycle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the package and servers
        run: python -m pip install ".[testing]" "gunicorn==27.0.1" "uWSGI==2.0.31"
      - name: Exercise real server hooks
        env:
          FORKSAFE_LIVE_TESTS: "1"
        run: python -m pytest -q tests/test_live_servers.py
