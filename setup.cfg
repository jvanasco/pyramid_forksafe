[metadata]
name = pyramid_forksafe
version = attr: pyramid_forksafe.__VERSION__
url = https://github.com/jvanasco/pyramid_forksafe
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
description = Standardizes server fork events into Pyramid events
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE.txt
keywords = web, pyramid, fork, uwsgi, nginx
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
include_package_data = True
zip_safe = False
python_requires = >=3.6
install_requires =
    pyramid
    zope.interface
    setuptools<82; python_version >= "3.7" and python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
pyramid_forksafe =
    py.typed
    debugtoolbar/panels/templates/*.dbtmako

[options.extras_require]
testing =
    coverage
    mypy
    pytest
    pyramid_debugtoolbar

[tox:tox]
envlist = py36, py37, py38, py39, py310, py311, py312, py313, py314, py315

[testenv]
package = wheel
extras = testing
commands =
    python --version
    python -m coverage run --source=pyramid_forksafe -m pytest {posargs}
    python -m coverage html -d {envtmpdir}/htmlcov

[flake8]
application_import_names = pyramid_forksafe
import_order_style = appnexus

exclude = .eggs, .tox, build

# E501 line too long
per-file-ignores:
    src/pyramid_forksafe/debugtoolbar/panels/forksafe.py: E501
    src/pyramid_forksafe/containers/uwsgi.py: E501
    src/pyramid_forksafe/containers/gunicorn.py: E501
    tests/test_config.py: E501
