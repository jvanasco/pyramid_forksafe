[easy_install]
zip_ok = false

[flake8]
application_import_names = pyramid_forksafe
import_order_style = appnexus

exclude = .eggs, .tox, build

# E501 line too long
per-file-ignores:
    setup.py: E501
    src/pyramid_forksafe/debugtoolbar/panels/forksafe.py: E501
    src/pyramid_forksafe/containers/uwsgi.py: E501
    src/pyramid_forksafe/containers/gunicorn.py: E501
    tests/test_config.py: E501
    
